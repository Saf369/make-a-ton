<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Vibrant Blue to Violet Gradient -->
    <linearGradient id="blLoopGrad" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="38%" stop-color="#3B82F6" />
      <stop offset="72%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Inner Shadow & Highlight -->
    <linearGradient id="blTopFold" x1="20" y1="18" x2="65" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="blBottomFold" x1="20" y1="52" x2="82" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="blGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366F1" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Modern Continuous Loop "B" Ribbon Shape -->
  <g filter="url(#blGlow)">
    <!-- Main Outer Loop / Spine -->
    <path
      d="M26 18
         C26 14 30 11 35 11
         L54 11
         C67 11 77 19 77 31
         C77 39 71 46 62 48.5
         C74 51.5 82 59.5 82 71
         C82 83.5 70 91 55 91
         L33 91
         C28 91 24 87 24 82
         L24 24
         C24 20.7 24.9 18 26 18 Z"
      fill="url(#blLoopGrad)"
    />

    <!-- Upper Counter Loop Cutout (Smoothed organically) -->
    <path
      d="M42 27
         L52 27
         C58.5 27 63 30.5 63 36
         C63 41.5 58.5 45 52 45
         L42 45
         Z"
      fill="#FFFFFF"
    />

    <!-- Lower Counter Loop Cutout (Smoothed organically) -->
    <path
      d="M42 56
         L54 56
         C61 56 66.5 60 66.5 66.5
         C66.5 73 61 77 54 77
         L42 77
         Z"
      fill="#FFFFFF"
    />

    <!-- Accent Inner Ribbon Flow Fold -->
    <path
      d="M24 45
         C24 45 44 45 53 45
         C63 45 70 51 70 60
         C70 52 64 47 54 46
         C46 45 24 45 24 45 Z"
      fill="#FFFFFF"
      opacity="0.18"
    />
  </g>
</svg>
